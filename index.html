    <!-- 1. Cargar la librería StPageFlip -->
    <script src="js/page-flip.browser.js"></script>

    <!-- 2. Inicializar el libro -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('revista-container');
            const paginas = document.querySelectorAll('.pagina');

            const pageFlip = new St.PageFlip(container, {
                width: 400,
                height: 600,
                size: "stretch",
                minWidth: 300,
                maxWidth: 600,
                minHeight: 450,
                maxHeight: 900,
                startPage: 0,
                showCover: true,
                flippingTime: 800,
                usePortrait: true,
                drawShadow: true,
                mobileScrollSupport: true,
                swipeDistance: 80
            });

            pageFlip.loadFromHTML(paginas);
            pageFlip.flip(0);

            let pinchGesture = false;
            let pageFlipCooldownUntil = 0;

            window.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1 || Date.now() < pageFlipCooldownUntil) {
                    pinchGesture = true;
                    event.stopImmediatePropagation();
                }
            }, true);

            window.addEventListener('touchmove', function(event) {
                if (pinchGesture || event.touches.length > 1) {
                    pinchGesture = true;
                    event.stopImmediatePropagation();
                }
            }, true);

            window.addEventListener('touchend', function(event) {
                if (pinchGesture) {
                    event.stopImmediatePropagation();
                    if (event.touches.length === 0) {
                        pinchGesture = false;
                        pageFlipCooldownUntil = Date.now() + 500;
                    }
                }
            }, true);
        });
    </script>
